---
# Artifact descriptor for the Jellyfin 12.x build (net10.0).
# The Jellyfin 10.11.x build is described by build.yaml.
#
# Jellyfin 12.0 is 10.12 renamed (the leading "10." was dropped); the plugin API
# is unchanged from 10.11, so this build is compiled from identical sources and
# differs only in target framework and reference assemblies.
name: "Private Libraries"
guid: "a3f1c6d2-9b4e-4c8a-bf2d-7e5a1c9d40e1"
version: "1.9.1.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Restrict each user to only their requested or granted media."
description: >
  Restricts which media each user sees inside their libraries. Media becomes
  visible either when the user requests it through Jellyseerr (auto-granted via
  webhook, plus an API sync that backfills requests made before the plugin was
  installed) or when they add it from a home-screen widget. Built on Jellyfin's
  native per-user allowed-tags whitelist: each user gets a personal tag and only
  sees items carrying it. Every user can turn their own restriction off from the
  widget.
category: "General"
owner: "TIGamingTV"
artifacts:
  - "Jellyfin.Plugin.PrivateLibraries.dll"
